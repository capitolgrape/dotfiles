stylesheets: ["style.css"]
default_page: outputs

window:
    height: 630
    width: 980

image:
    resize_size: 560
    widget_size: 170

classes:
    window: window
    image_card: card
    image_card_loading: card-loading
    image: image
    image_label: image-label
    notebook: notebook
    tab_label: tab-label
    notebook_page: page
    region_button: region-button
    restore_button: restore-button

windows:
    min_per_row: 3
    max_per_row: 999
    clicks: 1
    spacing: 10

outputs:
    clicks: 1
    spacing: 8
    show_label: false
    respect_output_scaling: true

region:
    command: slurp -f '%o@%x,%y,%w,%h'

hide_token_restore: true

debug: false
