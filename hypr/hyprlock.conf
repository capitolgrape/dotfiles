$font = JetBrains Mono

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3.5, linear
    animation = fadeOut, 1, 3.5, linear
    animation = inputFieldDots, 1, 1.5, linear
}

background {
    monitor =
    path = rgba(0, 0, 0, 0.0)  #screenshot
    blur_passes = 0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = rgba(ee88eeee) rgba(7733ccee) 45deg
    check_color = rgba(ffaaffee) rgba(aa66ffee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text =
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font

    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d %Y"
    font_size = 25
    font_family = $font

    position = 0, 300
    halign = center
    valign = center
}
