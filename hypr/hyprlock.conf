$entry_background_color = rgba(ADD8E6FF)
$entry_color = rgba(FFB6C1FF)
$text_color = rgba(FFFDD0DD)
$font_family = JetBrains Mono
$font_family_clock = Rubik Extrabold

background {
    blur_size = 15
    blur_passes = 4
    brightness = 0.33
}
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 0
    dots_size = 0.1
    dots_spacing = 0.3
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = false

    position = 0, 120
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 64
    font_family = $font_family_clock

    position = 0, 160
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $text_color
    font_size = 16
    font_family = $font_family

    position = 0, 100
    halign = center
    valign = center
}