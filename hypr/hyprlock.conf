background {
    monitor =
    blur_size = 5
    blur_passes = 4
    noise = 0.015
    contrast = 0.95
    brightness = 0.75
    vibrancy = 0.18
    vibrancy_darkness = 0.05
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 100
    font_family = JetBrains Mono ExtraBold
    shadow_passes = 4
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.3)
    position = 0, 280
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(255, 255, 255, 0.6)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 190
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 56
    outline_thickness = 1
    dots_size = 0.15
    dots_spacing = 0.4
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.05)
    outer_color = rgba(255, 255, 255, 0.15)
    font_color = rgba(255, 255, 255, 0.9)
    check_color = rgba(255, 255, 255, 1.0)
    fail_color = rgba(ff5555ee)
    fade_on_empty = true
    fade_timeout = 1200
    rounding = 28
    position = 0, 100
    halign = center
    valign = bottom
}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 1, default
    animation = fadeOut, 1, 1, default
}
